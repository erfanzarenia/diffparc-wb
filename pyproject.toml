[tool.poetry]
name = "diffparc-wb"
version = "0.1.0"
description = "diffparc-wb - Snakebids app for diffusion-based structural connectivity parcellation"
authors = ["Ali Khan <alik@robarts.ca>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8,<3.11"
snakebids = "^0.7.0"
snakemake = "^7.0.0"
boto3 = "^1.26.133"

[tool.poetry.dev-dependencies]
snakefmt = "^0.6.0"
poethepoet = "^0.10.0"
black = ">=22.1.0,<23.0.0"
isort = "^5.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
diffparc-wb = "diffparc.run:main"
predict_subj = "predict_subj.run:main"

[tool.poe.tasks]
quality_check = { shell = "isort diffparc/*.py -c && black diffparc --check && snakefmt diffparc --check" }
quality_fix = { shell = "isort diffparc/*.py && black diffparc  && snakefmt diffparc" }

[tool.isort]
profile = "black"
multi_line_output = 3
