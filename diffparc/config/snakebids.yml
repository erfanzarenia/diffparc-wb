#tractography parameters
fod_algorithm: msmt_csd

#dwi_upsample: 1.25mm now happens once, in SnakeDWI's/DiffParcSurf's own
# reg_dwi_to_t1.smk DWI->T1w resample (resample_dwi.resample_scheme: custom),
# via cubic B-spline. Disabled here so the FOD branch does not upsample AGAIN
# via a second mrgrid regrid on top of an already-1.25mm image.
dwi_upsample: false
dwi_upsample_vox: 1.25   # mm, isotropic (kept for reference / rule params)

enable_global_conn: true

resample_seed_res: '1x1x1mm' #for resampling seeds/targets

#voxel-based-seeding tractography (can move these to structure-specific config later..)

#surfdisp_normalization_fwhm_mm: 8

#for test data
###participant_label: 
###exclude_participant_label:
masking_method: b0_BET
b0_bet_frac: 0.5
#slspec_txt: False
#eddy_no_s2v: True

#use_eddy: False
#use_topup: False
#skip_dwi_preproc: False


stat_along_tcks: 'mean'  
stat_across_tcks: 'mean'

###in_prepdwi_dir: False
###in_snakedwi_dir: /scratch/Projects/SnakeMake_Test_Space/test_snakedwi/snakedwi

show_parallel_eta: False

nat_only: False
use_template_parcellation: False
###use_vbm: False

mrtrix:
  step: 0.625
  angle: 37
  minlength: 10
  maxlength: 250
  cutoff: 0.06
  # tck2connectome streamline->node assignment for voxelwise connectivity.
  # Endpoint assignment is effectively ASYMMETRIC:
  #   * Seed side  -> end-voxel (strict). Radial search tests the endpoint's own
  #     voxel first, and every seed endpoint sits inside a labelled seed voxel,
  #     so it is always assigned to its own voxel regardless of this radius.
  #   * Target side -> radial search out to target_search_radius (mm), since
  #     distal endpoints stop in unlabelled white matter and must reach a parcel.
  # 4-6 mm is typical for cortical/subcortical target matching.
  target_search_radius: 4

mrtrix_rng_seed: 7 #random number generator seed for reproducible results
  
wb_chunk_count: 2
wb_chunk_streamlines: 50000000   # 4 x 25M = 100M total ; fills the 64-core node

roi_enrichment:
  enabled: True
  seeds_per_voxel: 3000

resources:
  # ------------------------------------------------------------------
  # ONLY per-rule resources that SCALE with tractography parameters live here
  # (streamline count, chunk size, seeds-per-voxel, enrichment level). Tune these
  # when you change wb_chunk_streamlines, roi_enrichment.seeds_per_voxel, or
  # enrichment_sweep.levels. Image-driven / fixed-cost rules (dwi2fod, act_5ttgen,
  # tensor metrics, tractogram merges, QC, microstructure, mask-sweep per-job) are
  # hard-coded as rule defaults in workflow/rules/*.smk and intentionally NOT here.
  # ------------------------------------------------------------------

  # Whole-brain tractography. mem ~flat (~2 GB); threads fill the node; time tracks
  # wb_chunk_streamlines (~2 h per 25M-streamline chunk at 16 threads). 4x16=64 cores.
  wb_tckgen_chunk:
    threads: 16
    mem_mb: 4000
    time_min: 180

  # Seed-region tractography. Scales with seeds_per_vertex.
  roi_tckgen:
    threads: 8
    mem_mb: 2000
    time_min: 90

  # SIFT2 on the whole-brain tractogram. mem ~= O(streamlines) (~40 GB @ 100M).
  # threads:12 lets all 5 SIFT2 jobs (1 main + 4 enrichment) co-run (5x12=60<=64).
  sift2:
    threads: 12
    mem_mb: 48000
    time_min: 120

  # Endpoint filtering of the final tractogram. mem ~= O(streamlines) (~5.5 GB @ 100M).
  filter_tractogram:
    threads: 2
    mem_mb: 8000
    time_min: 60

  # --- enrichment sweep (scales with enrichment_sweep.levels & seeds_per_voxel) ---
  enrich_roi_tckgen_max:
    threads: 16
    mem_mb: 2000
    time_min: 45

  enrich_roi_subsample:        # memory-bound, single-threaded; mem ~= O(streamlines)
    threads: 2
    mem_mb: 28000
    time_min: 30

  enrich_sift2:                # mem ~= O(streamlines) (~38 GB); threads:12 for 5-wide concurrency
    threads: 12
    mem_mb: 46000
    time_min: 120

  enrich_combine:
    threads: 2
    mem_mb: 3000
    time_min: 90

  enrich_filter_tractogram:
    threads: 2
    mem_mb: 8000
    time_min: 60

  enrich_filter_tractogram_propagated:
    threads: 2
    mem_mb: 8000
    time_min: 60

  enrich_propagate_weights:    # one weight per streamline -> mem ~= O(streamlines)
    threads: 1
    mem_mb: 10000
    time_min: 15


# -----------------------------------------------------------------------------
# Connectivity matrix variants (rules/connectivity.smk + rules/mask_sweep.smk)
# Configurable, additive seed-voxel x atlas-target connectivity matrices. Each
# variant applies a different tck2connectome edge-scaling recipe (+/- SIFT2-mu
# scaling); the exact processing is spelled out in the filename `meas-` tag so it
# is unambiguous. The SAME naming is used for the main tracts/ matrices and the
# mask-sweep matrices.
#
#   config key                              filename tag              tck2connectome                  SIFT2 mu
#   raw                                     (no tag; primary csv)     (none)                          no   [baseline, MAIN deliverable]
#   mu_scaled                               meas-muscaled             (none)                          yes  [baseline]
#   volume_bias_corrected                   meas-invnodevol           -scale_invnodevol               no
#   length_bias_corrected                   meas-length               -scale_length                   no
#   volume_length_bias_corrected            meas-invnodevollength     -scale_invnodevol -scale_length no
#   volume_length_bias_corrected_mu_scaled  meas-invnodevollengthmu   -scale_invnodevol -scale_length yes
#
# Length bias correction uses -scale_length (weight each streamline's contribution
# BY its length), UP-weighting longer streamlines to counter their under-representation
# in probabilistic tracking (NOT -scale_invlength, which would down-weight them).
#
# raw + mu_scaled are the pipeline's BASELINE outputs: always produced by the core
# voxelwise_connectivity / sweep_voxelwise_connectivity rules. RAW is the MAIN
# deliverable (the untagged connectivity_matrix.csv that downstream consumes);
# mu_scaled is preserved alongside as the meas-muscaled block. Their keys below are
# informational (they document the baseline) and do not gate production. The four
# CORRECTED variants are the switched ones: each is built by the additive
# connectivity_variant / sweep_connectivity_variant rules only when its key is true.
connectivity_variants:
  raw: true                                     # baseline (always produced)
  mu_scaled: true                               # baseline (always produced)
  volume_bias_corrected: true
  length_bias_corrected: true
  volume_length_bias_corrected: true
  volume_length_bias_corrected_mu_scaled: true

# -----------------------------------------------------------------------------
# Tractography visual QC (rules/connectivity.smk)
# For the whole-brain and final seed-filtered tractograms, emit into /qc:
#   TDI, endpoint map, track-weighted DEC, FOD-based DEC (anatomical background),
#   a random 200k-streamline subset (.tck) for mrview, and a length histogram.
# On by default; the whole-brain pass runs tckmap x3 over the full tractogram, so
# turn this off to skip it.
# -----------------------------------------------------------------------------
tractography_qc: True
tractography_qc_nsubsample: 200000   # streamlines kept in the visual-inspection subset
tractography_qc_seed: 7             # RNG seed for that random subset (reproducible)

# -----------------------------------------------------------------------------
# Optional microstructure-weighted connectomes (rules/microstructure_connectomes.smk)
# For the whole-brain (final) tractogram + SIFT2 weights: sample FA/MD/RD along
# streamlines (tcksample -stat_tck mean) and build SIFT2-weighted, mean-edge atlas
# connectomes (tck2connectome -scale_file -stat_edge mean). MAIN connectivity only;
# additive. RD map + per-streamline samples are preserved. Off by default.
# -----------------------------------------------------------------------------
microstructure_connectomes: True
microstructure_connectomes_targets:
  - Yeo7TianS3
microstructure_connectomes_metrics:
  - FA
  - MD
  - RD
