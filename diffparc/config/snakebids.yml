# ---- Tractography ------------------------------------------------------------
fod_algorithm: msmt_csd
dwi_upsample: false    # resample already lands on 1.25mm; no second regrid
dwi_upsample_vox: 1.25
mrtrix:
  step: 0.625
  angle: 37
  minlength: 10
  maxlength: 250
  cutoff: 0.06
  target_search_radius: 4   # mm; radial search to assign target-side endpoints to a parcel
mrtrix_rng_seed: 7
wb_chunk_count: 2
wb_chunk_streamlines: 50000000
roi_enrichment:
  enabled: True
  seeds_per_voxel: 3000
enable_global_conn: true
resample_seed_res: '1x1x1mm'
show_parallel_eta: False
use_template_parcellation: False

# ---- Per-rule resources (only rules that scale with tractography params) ------
resources:
  wb_tckgen_chunk:
    threads: 16
    mem_mb: 4000
    time_min: 180
  roi_tckgen:
    threads: 8
    mem_mb: 2000
    time_min: 90
  sift2:
    threads: 12
    mem_mb: 48000
    time_min: 120
  filter_tractogram:
    threads: 2
    mem_mb: 8000
    time_min: 60

# ---- Connectivity outputs ----------------------------------------------------
# Additive tck2connectome variants, tagged in the filename `meas-`. raw + mu_scaled
# are always produced; the four *_bias_corrected are gated by the flags below.
connectivity_variants:
  raw: true
  mu_scaled: true
  volume_bias_corrected: true
  length_bias_corrected: true
  volume_length_bias_corrected: true
  volume_length_bias_corrected_mu_scaled: true

# ---- Experiment: seed-mask sweep (rules/mask_sweep.smk) -----------------------
mask_sweep:
  enabled: true
  thresholds:
    - 0.1
    - 0.2
    - 0.30
  mask_sources:
    - native
#    - brainsteminjected

# Tractography visual QC (TDI / endpoints / DEC / subset.tck / length histogram)
tractography_qc: True
tractography_qc_nsubsample: 200000
tractography_qc_seed: 7

# FA/MD/RD-weighted atlas connectomes from the final tractogram + SIFT2 weights
microstructure_connectomes: True
microstructure_connectomes_targets:
  - Yeo7TianS4
microstructure_connectomes_metrics:
  - FA
  - MD
  - RD

# ---- Experiment: ROI-enrichment strength sweep (rules/enrichment_sweep.smk) ---
enrichment_sweep:
  enabled: False
  seed: vtasncpbp            # ROI seed to sweep (per-hemi seed mask must exist)
  hemis:
    - L
    - R
  levels:                    # seeds-per-voxel-equivalent levels; max() is generated, rest subsampled
    - 1000
    - 5000
    - 10000
  subsample_seed: 427         # RNG seed for reproducible NESTED random subsampling
  subsample_seed: 78         # RNG seed for reproducible NESTED random subsampling
                             # (lower levels are strict subsets of higher ones:
                             #  1000 ⊂ 3000 ⊂ 5000)
  targets:                   # atlas(es) for the per-condition voxelwise connectivity fingerprint
    - Yeo7TianS4
  volume_bias_correction: True  # also emit a volume-bias-corrected fingerprint
                                 # (tck2connectome -scale_invnodevol) per condition,
                                 # alongside the uncorrected one. Off by default.
  sift2_propagated: False    # also emit a SECOND SIFT2 branch: instead of re-fitting
                             # SIFT2 after each enrichment merge (the default branch),
                             # fit SIFT2 once on the maximal combined tractogram and
                             # PROPAGATE those weights to lower levels via the nested
                             # subsample (streamlines + their weights). Adds outputs
                             # tagged `_sift2-propagated`; the default refit branch is
                             # always kept. Off by default.
