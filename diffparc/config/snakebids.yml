# =============================================================================
# diffparc-wb configuration
# =============================================================================

# ---- Snakebids / BIDS I/O ----------------------------------------------------
debug: True            # disable when generating a DAG visualization
root: ''
derivatives: False
tmp_dir: '/tmp'        # scratch for temp tractograms; override with $DIFFPARC_TMPDIR

analysis_levels: &analysis_levels
 - participant
 - group

targets_by_analysis_level:
  participant:
    - ''               # '' => run the first rule
  group:
    - 'all_legacy_csv' # FIXME: rule removed with tables.smk (see summary)

pybids_inputs:
  dwi:
    filters:
      suffix: 'dwi'
      extension: '.nii.gz'
      scope: 'all' #raw, derivatives (or can be pipeline name too!)
      invalid_filters: 'allow'
      datatype: 'dwi'
    wildcards:
      - subject
      - session
      - acquisition
      - run
      - direction

  T1w:
    filters:
      suffix: 'T1w'
      extension: '.nii.gz'
      scope: 'all' #raw, derivatives (or can be pipeline name too!)
      datatype: 'anat'
      invalid_filters: 'allow'
    wildcards:
      - subject
      - session
      - acquisition
      - run

   


parse_args:

  bids_dir:
    help: The directory with the input dataset formatted according 
          to the BIDS standard.

  output_dir:
    help: The directory where the output files 
          should be stored. If you are running group level analysis
          this folder should be prepopulated with the results of the
          participant level analysis.

  analysis_level: 
    help: Level of the analysis that will be performed. 
    choices: *analysis_levels

  --participant_label:
    help: The label(s) of the participant(s) that should be analyzed. The label 
          corresponds to sub-<participant_label> from the BIDS spec 
          (so it does not include "sub-"). If this parameter is not 
          provided all subjects should be analyzed. Multiple 
          participants can be specified with a space separated list.
    nargs: '+'

  --exclude_participant_label:
    help: The label(s) of the participant(s) that should be excluded. The label 
          corresponds to sub-<participant_label> from the BIDS spec 
          (so it does not include "sub-"). If this parameter is not 
          provided all subjects should be analyzed. Multiple 
          participants can be specified with a space separated list.
    nargs: '+'

  --in_prepdwi_dir:
    help: 'Skip dwi pre-processing and use preprocessing dwi, brainmask, and bedpost, from prepdwi instead. Specify the prepdwi directory that contains the work and prepdwi sub-directories. (default: %(default)s)'
    default: False
    type: Path

  --in_snakedwi_dir:
    help: 'Skip dwi pre-processing and use preprocessing dwi, brainmask, and bedpost, from snakedwi instead. Specify the snakedwi directory that contains the sub-* directories. (default: %(default)s)'
    default: False
    type: Path

  --masking_method:
    help: 'Brain masking method to use (default: %(default)s)'
    nargs: '?'
    choices: 
      - 'b0_BET'
      - 'b0_SyN'
    default: 'b0_BET'

  --b0_bet_frac:
    help: 'BET fractional intensity threshold for b0 masking (default: %(default)s)'
    default: 0.5

  --no_vol:
    help: 'Disable volume-based workflow. (default: %(default)s'
    action: 'store_true'
    default: False

# ---- Execution environment ---------------------------------------------------
singularity:
  # Primary pipeline container (REQUIRED): the FSL-enabled diffparc-deps image, whose home is
  # diffparc/resources/apptainer/diffparc-deps_with_fsl.sif. The value below is a repo-relative
  # placeholder; for an actual run set an ABSOLUTE path here, or override via $DIFFPARC_CONTAINER
  # (takes priority) -- the path is used as-is, not resolved against the repo.
  diffparc: "resources/apptainer/diffparc-deps_with_fsl.sif"

# ---- DWI import & preprocessing ----------------------------------------------
resample_dwi:
  # 'custom' at 1.25mm: DWI->T1w resample lands directly on the final 1.25mm
  # grid (single resample, cubic B-spline) in reg_dwi_to_t1.smk. dwi_upsample
  # (below) is disabled to match -- the FOD branch no longer re-upsamples via
  # a separate mrgrid regrid. Must match snakedwi's config/snakebids.yml.
  resample_scheme: 'custom' # should be one of: ['T1w', 'orig', 'custom']
  custom_resolution: #only needed if the 'custom'
  resample_mm:
    - 1.25
    - 1.25
    - 1.25


# native bias-correction; keep False when driven by snakedwi (it already does it)
dwi_biascorrect: False
masking_method: b0_BET
b0_bet_frac: 0.5
eddy_no_s2v: False

# ---- Registration template ---------------------------------------------------
template: MNI152NLin2009cAsym
template_t1w: resources/tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-01_T1w.nii.gz
template_mask: resources/tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-01_desc-brain_mask.nii.gz
template_b0: resources/tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-dwi_desc-fromhcp_b0.nii.gz

# ---- ANTs registration -------------------------------------------------------
ants:
  dim: 3
  random_seed: 42 #requires ants version at least 2.3.1 (includes --random-seed option)
  intensity_opts: '-u 1 -w [0.01,0.99] -z 1'
  linear:
    reg_iterations: '1000x500x250x0'
    shrink_factors: '6x4x2x1'
    smoothing_factors: '4x2x1x0'
  deform:
    shrink_factors: '12x6x4x2x1'  # default in antsMVTC2: 6x4x2x1 
    smoothing_factors: '6x3x2x1x0vox' # default in antsMVTC2: 3x2x1x0 
    reg_iterations: '100x100x70x50x10' # default in antsMVTC2: 100x100x70x20 
    transform_model: 'SyN[0.1,3,0]'
    sim_metric: CC
  shape_update:
  gradient_step: 0.25


# ---- Seeds & targets ---------------------------------------------------------
select_seeds:
  - vtasncpbp

seeds:
  vtasnc:
    template_probseg: resources/tpl-MNI152NLin2009cAsym/CIT168_prob/vtasnc_hemi-{hemi}_probseg.nii.gz
    probseg_threshold: 0.05
    probseg_resample: '200%'
    use_synthseg: False
    targets: 
    #  - Yeo17TianS4
    #  - Schaefer100TianS4
    #  - SynthSegTianS4
       - Yeo7TianS4
       
    fwhm_conn: 2mm
    streamline_threshold_percent: 4
    seeds_per_vertex:
      - 250
    normalize_percentile: 95 #normalize connectivity to each target before maxprob
    
  # --- experimental mask_sweep split midbrain seeds (additive) --------------
  # snc       = SNc only             (nigrostriatal)
  # vtapbp    = VTA + PBP merged     (mesolimbic A10; SNr excluded)
  # vtasncpbp = SNc + VTA + PBP      (full DA midbrain; SNr excluded)
  # The template_probseg files are generated once by workflow/scripts/generate_probsegs.py
  snc:
    template_probseg: resources/tpl-MNI152NLin2009cAsym/CIT168_prob/snc_hemi-{hemi}_probseg.nii.gz
    probseg_threshold: 0.05
    probseg_resample: '200%'
    use_synthseg: False
    targets:
       - Yeo7TianS4
    fwhm_conn: 2mm
    streamline_threshold_percent: 4
    seeds_per_vertex:
      - 250
    normalize_percentile: 95
  vtapbp:
    template_probseg: resources/tpl-MNI152NLin2009cAsym/CIT168_prob/vtapbp_hemi-{hemi}_probseg.nii.gz
    probseg_threshold: 0.05
    probseg_resample: '200%'
    use_synthseg: False
    targets:
       - Yeo7TianS4
    fwhm_conn: 2mm
    streamline_threshold_percent: 4
    seeds_per_vertex:
      - 250
    normalize_percentile: 95
  vtasncpbp:
    template_probseg: resources/tpl-MNI152NLin2009cAsym/CIT168_prob/vtasncpbp_hemi-{hemi}_probseg.nii.gz
    probseg_threshold: 0.05
    probseg_resample: '200%'
    use_synthseg: False
    # Active seed: parcellate against ALL FOUR target atlases. These are selectable --
    # comment out any you don't want; the tractography/SIFT2 stages are shared, so each
    # extra atlas only adds a cheap warp + tck2connectome. All four pair a cortical
    # parcellation with the Tian S4 subcortex; SynthSegTianS4 uses native SynthSeg
    # (DKT) cortex instead of a template-warped cortical atlas.
    targets:
       - Yeo7TianS4
       - Yeo17TianS4
       - Schaefer100TianS4
       - SynthSegTianS4
    fwhm_conn: 2mm
    streamline_threshold_percent: 4
    seeds_per_vertex:
      - 250
    normalize_percentile: 95
    

synthseg_labels:       # only used when a seed sets use_synthseg: True
  vtasnc:
    L: "16"
    R: "16"

hemispheres:
  - 'L'
  - 'R'

