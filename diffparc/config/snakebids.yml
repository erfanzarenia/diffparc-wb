#tractography parameters
fod_algorithm: msmt_csd

dwi_upsample: true
dwi_upsample_vox: 1.25   # mm, isotropic

enable_global_conn: true
disable_voxelwise_conn: true

resample_seed_res: '1x1x1mm' #for resampling seeds/targets

#voxel-based-seeding tractography (can move these to structure-specific config later..)

#surfdisp_normalization_fwhm_mm: 8

#for test data
###participant_label: 
###exclude_participant_label:
masking_method: b0_BET
b0_bet_frac: 0.5
#slspec_txt: False
#eddy_no_s2v: True

#use_eddy: False
#use_topup: False
#skip_dwi_preproc: False


stat_along_tcks: 'mean'  
stat_across_tcks: 'mean'

###in_prepdwi_dir: False
###in_snakedwi_dir: /scratch/Projects/SnakeMake_Test_Space/test_snakedwi/snakedwi

show_parallel_eta: False

nat_only: False
use_template_parcellation: False
###use_vbm: False

methods:
  - mrtrix

mrtrix:
  step: 0.625
  angle: 37
  minlength: 10
  maxlength: 250
  cutoff: 0.06
  # tck2connectome streamline->node assignment for voxelwise connectivity.
  # Endpoint assignment is effectively ASYMMETRIC:
  #   * Seed side  -> end-voxel (strict). Radial search tests the endpoint's own
  #     voxel first, and every seed endpoint sits inside a labelled seed voxel,
  #     so it is always assigned to its own voxel regardless of this radius.
  #   * Target side -> radial search out to target_search_radius (mm), since
  #     distal endpoints stop in unlabelled white matter and must reach a parcel.
  # 4-6 mm is typical for cortical/subcortical target matching.
  target_search_radius: 4

mrtrix_rng_seed: 7 #random number generator seed for reproducible results
  
wb_chunk_count: 2
wb_chunk_streamlines: 50000000

roi_enrichment:
  enabled: True
  seeds_per_voxel: 3000

resources:
  dwi2fod_msmt:
    threads: 12
    mem_mb: 8000
    time_min: 15
 
  act_5ttgen:
    threads: 4
    mem_mb: 16000      
    time_min: 120
  
  wb_tckgen_chunk:
    threads: 16
    mem_mb: 4000
    time_min: 360
 
  roi_tckgen:
    threads: 8
    mem_mb: 4000       
    time_min: 15
    
  sift2:
    threads: 16
    mem_mb: 64000       
    time_min: 60
    
  filter_tractogram:  
    threads: 2
    mem_mb: 16000     
    time_min: 30

mask_sweep:
  enabled: true
  thresholds:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.30
  mask_sources:
    - native
    - brainsteminjected

# -----------------------------------------------------------------------------
# Tractography visual QC (rules/connectivity.smk + rules/enrichment_sweep.smk)
# For the whole-brain and final seed-filtered tractograms, emit into /qc:
#   TDI, endpoint map, track-weighted DEC, FOD-based DEC (anatomical background),
#   a random 200k-streamline subset (.tck) for mrview, and a length histogram.
# On by default; the whole-brain pass runs tckmap x3 over the full tractogram, so
# turn this off to skip it.
# -----------------------------------------------------------------------------
tractography_qc: True
tractography_qc_nsubsample: 200000   # streamlines kept in the visual-inspection subset
tractography_qc_seed: 7             # RNG seed for that random subset (reproducible)

# -----------------------------------------------------------------------------
# Optional microstructure-weighted connectomes (rules/microstructure_connectomes.smk)
# For the whole-brain (final) tractogram + SIFT2 weights: sample FA/MD/RD along
# streamlines (tcksample -stat_tck mean) and build SIFT2-weighted, mean-edge atlas
# connectomes (tck2connectome -scale_file -stat_edge mean). MAIN connectivity only;
# additive. RD map + per-streamline samples are preserved. Off by default.
# -----------------------------------------------------------------------------
microstructure_connectomes: True
microstructure_connectomes_targets:
  - Yeo7TianS3
microstructure_connectomes_metrics:
  - FA
  - MD
  - RD

# -----------------------------------------------------------------------------
# Experimental enrichment_sweep (additive, fully isolated; see rules/enrichment_sweep.smk)
# Sweeps ROI seeding strength by generating ONE max-enrichment ROI tractogram and
# random-subsampling it for lower levels. WB baseline is the reference condition.
# Does NOT alter core pipeline behavior. Off by default.
# -----------------------------------------------------------------------------
enrichment_sweep:
  enabled: True
  seed: vtasncpbp            # ROI seed to sweep (per-hemi seed mask must exist)
  hemis:
    - L
    - R
  levels:                    # seeds-per-voxel-equivalent levels; max() is generated, rest subsampled
    - 5000
    - 3000
    - 1000
  subsample_seed: 42         # RNG seed for reproducible NESTED random subsampling
  subsample_seed: 7         # RNG seed for reproducible NESTED random subsampling
                             # (lower levels are strict subsets of higher ones:
                             #  1000 ⊂ 3000 ⊂ 5000)
  targets:                   # atlas(es) for the per-condition voxelwise connectivity fingerprint
    - Yeo7TianS3
  volume_bias_correction: True  # also emit a volume-bias-corrected fingerprint
                                 # (tck2connectome -scale_invnodevol) per condition,
                                 # alongside the uncorrected one. Off by default.
  sift2_propagated: True    # also emit a SECOND SIFT2 branch: instead of re-fitting
                             # SIFT2 after each enrichment merge (the default branch),
                             # fit SIFT2 once on the maximal combined tractogram and
                             # PROPAGATE those weights to lower levels via the nested
                             # subsample (streamlines + their weights). Adds outputs
                             # tagged `_sift2-propagated`; the default refit branch is
                             # always kept. Off by default.
